name: Test Coverage

on:
  pull_request:
    types: [labeled]

# Required for posting PR comments and accessing private repos
permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    # Only run when 'review' label is added
    if: github.event.label.name == 'review'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP with PCOV
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json, pcov
          coverage: pcov
          ini-values: pcov.enabled=1

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          # Remove composer.lock to regenerate from Packagist (lock file may have old private repo references)
          rm -f composer.lock
          composer update --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-req=ext-opentelemetry

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests with coverage
        run: |
          php -d pcov.enabled=1 vendor/bin/phpunit \
            --coverage-clover coverage/clover.xml \
            --coverage-text=coverage/coverage.txt \
            --colors=never
        continue-on-error: false

      - name: Generate coverage report
        id: coverage-report
        run: |
          # Extract coverage summary
          COVERAGE_SUMMARY=$(cat coverage/coverage.txt)

          # Extract line coverage percentage
          LINE_COVERAGE=$(grep -E "^\s+Lines:" coverage/coverage.txt | head -1 | grep -oE '[0-9]+\.[0-9]+%' || echo "N/A")

          # Extract method coverage percentage
          METHOD_COVERAGE=$(grep -E "^\s+Methods:" coverage/coverage.txt | head -1 | grep -oE '[0-9]+\.[0-9]+%' || echo "N/A")

          # Extract class coverage percentage
          CLASS_COVERAGE=$(grep -E "^\s+Classes:" coverage/coverage.txt | head -1 | grep -oE '[0-9]+\.[0-9]+%' || echo "N/A")

          # Save to output
          echo "line_coverage=$LINE_COVERAGE" >> $GITHUB_OUTPUT
          echo "method_coverage=$METHOD_COVERAGE" >> $GITHUB_OUTPUT
          echo "class_coverage=$CLASS_COVERAGE" >> $GITHUB_OUTPUT

          # Save full report to file for comment
          {
            echo "COVERAGE_REPORT<<EOF"
            cat coverage/coverage.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Find existing coverage comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '## Test Coverage Report'

      - name: Create or update coverage comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## Test Coverage Report

            | Metric | Coverage |
            |--------|----------|
            | **Lines** | ${{ steps.coverage-report.outputs.line_coverage }} |
            | **Methods** | ${{ steps.coverage-report.outputs.method_coverage }} |
            | **Classes** | ${{ steps.coverage-report.outputs.class_coverage }} |

            <details>
            <summary>Full Coverage Report</summary>

            ```
            ${{ steps.coverage-report.outputs.COVERAGE_REPORT }}
            ```

            </details>

            ---
            *Coverage generated by [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) on ${{ github.event.pull_request.head.sha }}*
