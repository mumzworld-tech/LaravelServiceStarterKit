; FrankenPHP configuration for Horizon workers
; This file might be minimal or unnecessary if Horizon is run via `php artisan horizon`
; and not served by FrankenPHP directly.

; If you were to use FrankenPHP to serve a dashboard or API related to Horizon (less common for workers):
; frankenphp.Caddyfile = "/path/to/your/Caddyfile.horizon"

; Worker settings (might not apply if not using FrankenPHP server features for Horizon)
; frankenphp.worker.num_workers = 2 