; Xdebug Configuration (copied by Dockerfile.dev)
[xdebug]
xdebug.mode = develop,debug
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.log_level = 0 ; Set to 7 for detailed logs, 0 to disable Xdebug's own logging
xdebug.discover_client_host = true
; xdebug.idekey = "YOUR_IDE_KEY" ; Uncomment and set if your IDE uses a specific key (e.g., VSCODE, PHPSTORM) 